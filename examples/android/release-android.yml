name: release-android
# ANDROID shape. Signed build on release.
#
# ⚠️ ARTIFACT FORMAT IS UNCONFIRMED. Distribution runs through an Intune-managed
# Play Store, and the path decides the file:
#   - Managed Google Play private app  → AAB  (bundleRelease)
#   - Intune line-of-business app      → APK  (assembleRelease)
# This file assumes AAB. Confirm with the Intune owner before relying on it; see
# section 2.4a of the setup runbook.
#
# versionCode must strictly increase on every upload — both Play and Intune reject
# an update that doesn't raise it — and the app already has versionCodes from ADO.
# Scheme: run_number + OFFSET, where OFFSET is set ONCE above the current highest
# distributed versionCode and stored as the repo variable VERSION_CODE_OFFSET.  🔧
#
# Rejected alternative: deriving versionCode from semver (1.2.3 → 10203) reads
# nicely but caps minor/patch at 99 and makes re-uploading the same version
# impossible, so a failed upload leaves you stuck.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: play             # 🔧 approval gate, if wanted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Restore keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
      - name: Build signed bundle
        env:
          VERSION_NAME: ${{ github.event.release.tag_name }}
          VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET }}
        run: |
          ./gradlew bundleRelease \
            -PversionName="${VERSION_NAME#v}" \
            -PversionCode=$(( GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET ))
      - name: Attach AAB to the release
        run: gh release upload "${GITHUB_REF_NAME}" app/build/outputs/bundle/release/*.aab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 🔧 Decide whether the release also uploads to a Play track (internal / alpha /
# production) via the Play Developer API, or stops at the Release asset.
